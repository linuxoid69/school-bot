name: Build school-bot
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]

jobs:
  prepare-needs:
    runs-on: ubuntu-latest
    outputs:
      needs_list: ${{ steps.set-needs.outputs.needs_list }}
    steps:
      - name: Set needs list
        id: set-needs
        run: |
          echo "needs_list=['testReport', 'goLinter', 'buildImage', 'pushImage']" >> $GITHUB_OUTPUT
  testReport:
    name: Test report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/checkout@master
      - name: Run tests
        run: go install github.com/becheran/go-testreport@main && go mod download && source .env-test &&
             go test ./... -json | go-testreport -vars="Title:Test Report Linux" >> $GITHUB_STEP_SUMMARY
  goLinter:
    name: Golang linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Golang linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --config=.golangci.yml
  buildImage:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Build image
        run: make build_image
  pushImage:
    name: Push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Push image
        run: make push_image
  sendResultSuccess:
    needs: prepare-needs
    if: success()
    name: Send result build if success
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Send message to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          format: markdown
          message: |
            Finish build ${{ github.repository }} job status ☀️
  sendResultFailure:
    needs: prepare-needs
    if: failure()
    name: Send result build if failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Send message to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          format: markdown
          message: |
            Finish build ${{ github.repository }} job status ⚡️
            Current Workflow URL: [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
