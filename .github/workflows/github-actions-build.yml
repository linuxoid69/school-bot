name: Build school-bot
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]

jobs:
  testReport:
    name: Test report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Test report
        run: go test ./... -json > report.json
      - name: Report
        uses: becheran/go-testreport@main
        with:
          input: report.json
  goLinter:
    name: Golang linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Golang linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58
  sendResultSuccess:
    needs: ["testReport", "goLinter"]
    if: success()
    name: Send result build if success
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Send message to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Finish build ${{ github.repository }} job status ☀️
  sendResultFailure:
    needs: ["testReport", "goLinter"]
    if: failure()
    name: Send result build if failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Send message to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Finish build ${{ github.repository }} job status ⚡️
            Current Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
