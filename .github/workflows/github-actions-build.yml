name: Build school-bot
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]

jobs:
  testReport:
    name: Test report
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - uses: actions/checkout@master
      - name: Install go-testreport
        run: go install github.com/becheran/go-testreport@main
      - name: Test
        run: ls -l
        # run: ls -l && go mod download && go test ./...
        # run: go mod download && go test ./... -json | go-testreport -vars="Title:Test Report Linux"
  goLinter:
    name: Golang linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Golang linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58
  sendResultSuccess:
    needs: ["testReport", "goLinter"]
    if: success()
    name: Send result build if success
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Send message to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          format: markdown
          message: |
            Finish build ${{ github.repository }} job status ☀️
  sendResultFailure:
    needs: ["testReport", "goLinter"]
    if: failure()
    name: Send result build if failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Send message to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          format: markdown
          message: |
            Finish build ${{ github.repository }} job status ⚡️
            Current Workflow URL: [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
